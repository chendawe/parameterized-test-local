<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>贪吃蛇</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      color: #fff;
      font-family: Arial;
      padding-top: 30px;
    }
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
    canvas {
      border: 3px solid #444;
      background: #222;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="snake" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('snake');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const grid = 20;
    const count = 20;

    let snake = [{ x: 10, y: 10 }];
    let dx = 1, dy = 0;
    let food = {};
    let score = 0;
    let loop;

    function randomFood() {
      food = {
        x: Math.floor(Math.random() * count),
        y: Math.floor(Math.random() * count)
      };
      for (let p of snake) {
        if (p.x === food.x && p.y === food.y) return randomFood();
      }
    }

    function draw() {
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#3f3';
      snake.forEach(p => {
        ctx.fillRect(p.x * grid, p.y * grid, grid - 2, grid - 2);
      });

      ctx.fillStyle = '#f33';
      ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count) {
        clearInterval(loop);
        alert('Game Over! Score: ' + score);
        return;
      }
      for (let p of snake) {
        if (p.x === head.x && p.y === head.y) {
          clearInterval(loop);
          alert('Game Over! Score: ' + score);
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = 'Score: ' + score;
        randomFood();
      } else {
        snake.pop();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
      if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
      if (e.key === 'ArrowUp' && dy !== 1) { dy = -1; dx = 0; }
      if (e.key === 'ArrowDown' && dy !== -1) { dy = 1; dx = 0; }
    });

    randomFood();
    loop = setInterval(() => {
      update();
      draw();
    }, 120);
  </script>
</body>
</html>
